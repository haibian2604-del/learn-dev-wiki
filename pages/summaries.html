<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>来源摘要 · my-knowledge</title>
<meta name="description" content="每篇原始资料一篇摘要：核心观点、关键数据、亮点与不足。">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="list" data-kind="summary">

<script>window.SITE_ROOT = "../";</script>
<header id="site-nav"></header>
<script src="../assets/nav.js"></script>

<main class="wrap" id="main">

  <div class="page-head">
    <div>
      <h1>来源摘要</h1>
      <p>每篇进入 <code>00-Raw/</code> 的原始资料对应一篇摘要：核心观点、关键数据、亮点与不足，并链回源文件。</p>
    </div>
    <span class="page-head__meta" id="generated-at"></span>
  </div>

  <div class="filters">
    <div class="field">
      <span class="field__label">领域</span>
      <select id="filter-domain"></select>
    </div>
    <div class="field">
      <span class="field__label">状态</span>
      <select id="filter-status"></select>
    </div>
    <div class="field">
      <span class="field__label">标签</span>
      <select id="filter-tag"></select>
    </div>
    <div class="field">
      <span class="field__label">搜索</span>
      <input id="filter-search" type="search" placeholder="标题 / 简介 / 来源…" autocomplete="off">
    </div>
    <button class="btn" id="filter-reset" type="button">重置</button>
    <span class="filters__spacer"></span>
    <span class="filters__count" id="filter-count"></span>
  </div>

  <div class="card-grid" id="card-grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

</main>

<footer id="site-footer"></footer>
<script src="../data/wiki-data.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
